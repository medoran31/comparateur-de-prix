name: comparateur_prix
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.0
  url_launcher: ^6.3.0
  uuid: ^4.5.0
  geolocator: ^13.0.0
  file_picker: ^10.3.8
  csv: ^6.0.0
  shared_preferences: ^2.3.0
  cupertino_icons: ^1.0.8
  share_plus: ^12.0.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"